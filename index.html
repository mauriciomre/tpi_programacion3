    <title>Sistema de Reservas</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"

    <!-- Bootstrap 4.6 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />

    <!-- AdminLTE 3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" />

    <!-- Tempusdominus Bootstrap 4 -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/tempusdominus-bootstrap-4/5.1.2/css/tempusdominus-bootstrap-4.min.css" />

    <!-- Tus estilos -->
    <link rel="stylesheet" href="assets/css/styles.css" />

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light fixed-top" style="background-color:#0a322c">
            <div class="container-fluid max-container">
                <a class="navbar-brand" href="#">
                    <img src="img/logo1.png" alt="Logo" width="150" height="70" class="d-inline-block align-text-top" />
                </a>

                <!-- Botón del menú -->
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup"
                    aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Contenedor del menú -->
                <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
                    <div class="navbar-nav text-white text-center">
                        <a class="nav-link text-white rounded active" href="#">Inicio</a>
                        <a class="nav-link text-white rounded" href="#/login">Iniciar sesión</a>
                        <a class="nav-link text-white rounded" href="#/reservas">Reservas</a>
                        <a class="nav-link text-white rounded" href="#/dashboard">Dashboard</a>
                        <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesión</button>
                    </div>
                </div>
            </div>
        </nav>
        <div class="container-fluid" style="min-height: 95px"></div>

    </header>

    <script>
        document.querySelectorAll('.navbar-nav .nav-link, #logoutBtn').forEach(item => {
            item.addEventListener('click', () => {
                const navbar = document.querySelector('.navbar-collapse');
                if (navbar.classList.contains('show')) {
                    $('.navbar-collapse').collapse('hide');
                }
            });
        });
    </script>

    <main id="app">
        <!-- Aquí se inyectan las vistas dinámicamente -->
    </main>

    <!-- Scripts -->

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <!-- Bootstrap 4.6 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Moment.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/es.js"></script>

    <!-- Tempusdominus Bootstrap 4 -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/tempusdominus-bootstrap-4/5.1.2/js/tempusdominus-bootstrap-4.min.js"></script>

    <!-- AdminLTE -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <script type="module" src="assets/js/app.js"></script>
</body>

    <div class="bg-secondary text-center py-2">

</footer>
