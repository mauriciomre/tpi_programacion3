<div class="container h-100" style="margin-top: 20px">
    <div class="row h-100 justify-content-center align-items-center">
        <div class="col-sm-12">
            <div class="card card-primary card-personalizada">

                <div class="card-header">
                    <h3 class="card-title">Nuevo usuario</h3>
                </div>

                <form id="registerForm">
                    <div class="card-body">

                        <div class="form-group">
                            <label for="registerInputName1">Nombre</label>
                            <input type="text" name="nombre" class="form-control" id="registerInputName1"
                                placeholder="Nombre completo" required />
                        </div>

                        <div class="form-group">
                            <label for="registerInputEmail1">Email</label>
                            <input type="email" name="email" class="form-control" id="registerInputEmail1"
                                placeholder="Email" required />
                        </div>

                        <div class="form-group">
                            <label for="registerInputPassword1">Contraseña</label>
                            <input type="password" name="password" class="form-control" id="registerInputPassword1"
                                placeholder="Mínimo 6 caracteres" required />
                        </div>

                    </div>

                    <div class="card-footer">
                        <button type="submit" class="btn btn-primary">Registrarse</button>
                        <a href="#/login" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
