<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitaciones - MALULA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container my-5">
        <div class="row">

            <div class="col-md-3">
                <div class="card card-personalizada shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Filtros</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="filtroTipo">Tipo de Habitación</label>
                            <select class="form-control" id="filtroTipo">
                                <option value="">Todos</option>
                                <option value="Junellia">Junellia</option>
                                <option value="Amancay">Amancay</option>
                            </select>
                        </div>
                        <button class="btn btn-secondary btn-block" id="btnFiltrarHabitaciones">Aplicar Filtros</button>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <h2 class="mb-4">Nuestras Habitaciones</h2>

                <div id="roomsContainer" class="row">
                    <div id="roomsLoader" class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="sr-only">Cargando...</span>
                        </div>
                        <p class="mt-3">Cargando habitaciones disponibles...</p>
                    </div>
                </div>

                <div id="noRoomsMessage" class="alert alert-warning" style="display:none;">
                    No se encontraron habitaciones que coincidan con los filtros.
                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="../js/controllers/roomsController.js"></script>

</body>

</html>
